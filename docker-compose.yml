x-api-lite: &api-lite
    image: ghcr.io/aymurai/api:latest
    build:
        context: .
        dockerfile: ./docker/api/Dockerfile
        target: aymurai-api
    shm_size: "2gb"
    ports:
        - "8899:8899"
    volumes:
        - ./resources/cache:/resources/cache
    env_file:
        - .env
        - .env.common

x-api-full: &api-full
    image: ghcr.io/aymurai/api:full
    build:
        context: .
        dockerfile: ./docker/api/Dockerfile
        target: aymurai-api-full
    shm_size: "2gb"
    ports:
        - "8899:8899"
    volumes:
        - ./resources/cache:/resources/cache
    env_file:
        - .env
        - .env.common
    restart: always
    deploy:
        resources:
            limits:
                memory: 4g
                cpus: "4.0"

x-llamacpp: &llamacpp-base
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
        - "8080:8080"
    volumes:
        - ${LLAMACPP_MODELS_DIR:-~/.llama.cpp/models}:/models:ro
    command: >
        -m /models/${LLAMACPP_MODEL_FILE}
        --host 0.0.0.0 --port 8080
        -c ${LLAMACPP_CTX_SIZE:-16384}
    environment:
        # Reasoning is a server-launch concern: it cannot be set per request
        # (llama.cpp discussion #21445), and chat_template_kwargs.enable_thinking
        # is model-dependent (issue #20182).
        LLAMA_ARG_REASONING: ${LLM_REASONING:-auto}
        LLAMA_ARG_THINK_BUDGET: ${LLM_THINK_BUDGET:--1}
    restart: always
    shm_size: "2gb"

x-coro: &coro-base
    shm_size: "2gb"
    ports:
        - "8000:8000"
    volumes:
        - coro-hf-cache:/root/.cache/huggingface
    profiles: ["asr"]
    networks:
        default:
            aliases: ["coro"]

services:
    llamacpp:
        <<: *llamacpp-base
        container_name: llamacpp

    llamacpp-gpu:
        <<: *llamacpp-base
        image: ghcr.io/ggml-org/llama.cpp:server-cuda
        container_name: llamacpp-gpu
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]

    aymurai-api:
        <<: *api-lite
        container_name: aymurai-api
        depends_on:
            - llamacpp
        environment:
            TORCH_DEVICE: cpu
            LLAMACPP_BASE_URL: http://llamacpp:8080/v1

    aymurai-api-gpu:
        <<: *api-lite
        container_name: aymurai-api-gpu
        depends_on:
            - llamacpp-gpu
        environment:
            TORCH_DEVICE: cuda
            LLAMACPP_BASE_URL: http://llamacpp-gpu:8080/v1
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]

    aymurai-api-full:
        <<: *api-full
        container_name: aymurai-api-full
        depends_on:
            - llamacpp
        environment:
            TORCH_DEVICE: cpu
            LLAMACPP_BASE_URL: http://llamacpp:8080/v1
            TRANSCRIBE_BASE_URL: http://coro:8000/v1

    aymurai-api-full-gpu:
        <<: *api-full
        container_name: aymurai-api-full-gpu
        depends_on:
            - llamacpp-gpu
        environment:
            TORCH_DEVICE: cuda
            LLAMACPP_BASE_URL: http://llamacpp-gpu:8080/v1
            TRANSCRIBE_BASE_URL: http://coro:8000/v1
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
                limits:
                    memory: 4g
                    cpus: "4.0"

    coro:
        <<: *coro-base
        image: ghcr.io/collectiveai-team/coro:${CORO_VERSION:-1.0.5}-cpu
        container_name: coro
        command:
            - --backend-asr
            - ${CORO_BACKEND_ASR:-onnx-asr}
            - --model-asr
            - ${CORO_MODEL_ASR:-nemo-canary-1b-v2}
            - --backend-diarization
            - ${CORO_BACKEND_DIARIZATION:-nemo}

    coro-gpu:
        <<: *coro-base
        image: ghcr.io/collectiveai-team/coro:${CORO_VERSION:-1.0.5}-gpu
        container_name: coro-gpu
        command:
            - --backend-asr
            - ${CORO_BACKEND_ASR_GPU:-faster-whisper}
            - --model-asr
            - ${CORO_MODEL_ASR_GPU:-openai/whisper-medium}
            - --backend-diarization
            - ${CORO_BACKEND_DIARIZATION:-nemo}
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]

volumes:
    coro-hf-cache:
