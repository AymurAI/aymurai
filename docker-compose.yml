x-api-lite: &api-lite
    image: ghcr.io/aymurai/api:latest
    build:
        context: .
        dockerfile: ./docker/api/Dockerfile
        target: aymurai-api
    shm_size: "2gb"
    ports:
        - "8899:8899"
    volumes:
        - ./resources/cache:/resources/cache
    env_file:
        - .env
        - .env.common

x-api-full: &api-full
    image: ghcr.io/aymurai/api:full
    build:
        context: .
        dockerfile: ./docker/api/Dockerfile
        target: aymurai-api-full
    shm_size: "2gb"
    ports:
        - "8899:8899"
    restart: always
    deploy:
        resources:
            limits:
                memory: 4g
                cpus: "4.0"

x-ollama: &ollama-base
    image: ollama/ollama
    ports:
        - "11434:11434"
    volumes:
        - ollama:/root/.ollama
    restart: always
    shm_size: "2gb"

services:
    ollama:
        <<: *ollama-base
        container_name: ollama

    ollama-gpu:
        <<: *ollama-base
        container_name: ollama-gpu
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]

    aymurai-api:
        <<: *api-lite
        container_name: aymurai-api
        depends_on:
            - ollama
        environment:
            TORCH_DEVICE: cpu
            OLLAMA_HOST: http://ollama:11434

    aymurai-api-gpu:
        <<: *api-lite
        container_name: aymurai-api-gpu
        depends_on:
            - ollama-gpu
        environment:
            TORCH_DEVICE: cuda
            OLLAMA_HOST: http://ollama-gpu:11434
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]

    aymurai-api-full:
        <<: *api-full
        container_name: aymurai-api-full
        depends_on:
            - ollama
        environment:
            TORCH_DEVICE: cpu
            OLLAMA_HOST: http://ollama:11434

    aymurai-api-full-gpu:
        <<: *api-full
        container_name: aymurai-api-full-gpu
        depends_on:
            - ollama-gpu
        environment:
            TORCH_DEVICE: cuda
            OLLAMA_HOST: http://ollama-gpu:11434
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
                limits:
                    memory: 4g
                    cpus: "4.0"

volumes:
    ollama:
