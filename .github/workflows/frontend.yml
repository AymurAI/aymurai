name: frontend

# Biome + both tsc projects + vitest. Scoped to frontend/** so backend-only PRs
# don't pay for a pnpm install. Playwright component tests are deliberately not
# here: they download browsers and belong in a separate, non-blocking job.

on:
  push:
    branches: [main, dev]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  workflow_call:

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  validate:
    name: lint, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # corepack (not `npm i -g pnpm`) so the version comes from package.json's
      # `packageManager` field and cannot drift from the lockfile.
      - name: Enable corepack
        run: corepack enable
        working-directory: .

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Panda's generated `styled-system` output is gitignored, so it must be
      # regenerated before tsc can resolve `@/styled/*`.
      - name: Panda codegen
        run: pnpm run panda:codegen

      - name: Lint & typecheck
        run: pnpm validate

      - name: Test
        run: pnpm test

      # Guards the class of bug that shipped broken images for months: the root
      # .gitignore's *.png / *.jpg globs silently excluded these from the repo,
      # so every clean-clone build served a broken landing logo and four broken
      # onboarding images. Cheap to assert, invisible otherwise.
      - name: Assert runtime assets are committed
        run: |
          set -eu
          for f in \
            src/renderer/public/brand/iso-white.png \
            src/renderer/public/brand/logo.jpg \
            src/renderer/public/onboarding-steps/step1.png \
            src/renderer/public/onboarding-steps/step2.png \
            src/renderer/public/onboarding-steps/step3.png \
            src/renderer/public/onboarding-steps/step4.png
          do
            git ls-files --error-unmatch "$f" >/dev/null \
              || { echo "::error::$f is not tracked by git"; exit 1; }
          done
