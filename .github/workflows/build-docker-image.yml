name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*' # Trigger on all tags
  workflow_dispatch: # Allows manual triggering of the workflow

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            defensoria_enabled: 'false'
            tag_suffix: ''
            floating_lite_tag: latest
            floating_full_tag: full
          - variant: defensoria
            defensoria_enabled: 'true'
            tag_suffix: '-defensoria'
            floating_lite_tag: defensoria
            floating_full_tag: full-defensoria

    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Step 1.5: Free up disk space (LibreOffice/JRE + frontend build can exceed runner disk)
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      # Step 2: Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Extract the tag name from the Git reference
      - name: Extract tag name
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ -z "$TAG" || "$TAG" == "$GITHUB_REF" ]]; then
            TAG="dev-${GITHUB_SHA::7}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Resolve image tags
        id: images
        env:
          VERSION_TAG: ${{ steps.tag.outputs.TAG }}
          TAG_SUFFIX: ${{ matrix.tag_suffix }}
          FLOATING_LITE_TAG: ${{ matrix.floating_lite_tag }}
          FLOATING_FULL_TAG: ${{ matrix.floating_full_tag }}
        run: |
          {
            echo 'LITE_TAGS<<EOF'
            echo "ghcr.io/aymurai/api:${VERSION_TAG}${TAG_SUFFIX}"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "ghcr.io/aymurai/api:${FLOATING_LITE_TAG}"
            fi
            echo 'EOF'
            echo 'FULL_TAGS<<EOF'
            echo "ghcr.io/aymurai/api:full-${VERSION_TAG}${TAG_SUFFIX}"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "ghcr.io/aymurai/api:${FLOATING_FULL_TAG}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Step 4: Build and push the Docker images
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          target: aymurai-api
          build-args: |
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.tag.outputs.TAG }}
            APP_VERSION=${{ steps.tag.outputs.TAG }}
            DEFENSORIA_ENABLED=${{ matrix.defensoria_enabled }}
          tags: ${{ steps.images.outputs.LITE_TAGS }}

      - name: Build and push Docker full image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          target: aymurai-api-full
          build-args: |
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.tag.outputs.TAG }}
            APP_VERSION=${{ steps.tag.outputs.TAG }}
            DEFENSORIA_ENABLED=${{ matrix.defensoria_enabled }}
          tags: ${{ steps.images.outputs.FULL_TAGS }}
