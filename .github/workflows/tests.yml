name: Tests

# Lint, type-check and test on every push to main and every PR.
# Runs the same prek hooks as locally (ruff-format, ruff, pyrefly, hygiene)
# plus the pytest suite, all through uv so versions match uv.lock.

on:
  push:
    branches: [main]
  pull_request:
  # Allow other workflows (e.g. release.yml) to gate on this suite.
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint, type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.12"
          enable-cache: true

      # Uses the version pinned by .python-version / pyproject.toml.
      - name: Set up Python
        run: uv python install

      # --frozen fails if uv.lock is out of date. --group tests pulls in
      # pytest, which lives in its own dependency-group (not installed by
      # plain `uv sync`).
      - name: Install dependencies
        run: uv sync --frozen --group tests

      # TODO(CES debt): pyrefly/ast-grep/file-size-guard/no-utils are skipped
      # because prek --all-files runs repo-wide, and the codebase predates
      # these checks (227 pyrefly errors, ~69 ast-grep CES findings, 3
      # oversized files, 7 catch-all-named modules as of 2026-07-07). Tracked
      # for a dedicated remediation PR — remove this SKIP once that lands.
      - name: Lint, format & type check (prek)
        env:
          SKIP: pyrefly,ast-grep,file-size-guard,no-utils
        run: uvx prek run --all-files --show-diff-on-failure

      - name: Run tests
        run: uv run pytest
