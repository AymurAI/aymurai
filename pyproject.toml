[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "aymurai"
requires-python = "==3.13.*"
dynamic = ["version"]
authors = [
    { name = "datagenero.org", email = "aymurai@datagenero.org" },
    { name = "collective.ai", email = "info@collectiveai.io" },
]
maintainers = [
    { name = "jedzill4", email = "r@collectiveai.io" },
    { name = "jansaldo", email = "juli@collectiveai.io" },
]
description = "The backend API and machine learning models of AymurAI."
readme = "README.md"
license = { file = "LICENSE.md" }
keywords = [
    "api",
    "deep-learning",
    "gender-equality",
    "justice",
    "document-analysis",
    "openjustice",
    "gender-data",
    "platform",
]
classifiers = [
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 5 - Production/Stable",

    # Indicate who your project is intended for
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Other Audience",

    # Pick your license as you wish (see also "license" above)
    "License :: OSI Approved :: MIT License",

    # Specify the Python versions you support here.
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "requests>=2.32.3",
    "numpy==2.5.1",
    "pandas>=2.3.3,<3",
    "more-itertools>=11.1.0",
    "joblib>=1.4.2",
    "datetime_matcher @ git+https://github.com/jedzill4/datetime_matcher",
    "jiwer==3.0.5",
    "unidecode==1.4.0",
    "flair==0.15.1",
    "fastapi[standard]>=0.139.2",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.20",
    "pydantic>=2.10.4",
    "pydantic_settings>=2.7.0",
    "rich>=13.9.4",
    "xmltodict==1.0.4",
    "cachetools>=5.5.0",
    "diskcache>=5.6.3",
    "torch>=2.12.1",
    "psutil==6.1.0",
    "sqlmodel==0.0.22",
    "alembic>=1.18.5",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
    "sentence-transformers>=5.6.0",
    "pymupdf>=1.28.0",
    "pymupdf4llm>=0.0.17",
    "pypandoc>=1.15",
    "python-docx>=1.2.0",
    "docx2txt>=0.9",
    "openai>=2.50.0",
    "ollama==0.6.1",
    "tiktoken==0.12.0",
]

[project.urls]
Homepage = "https://www.aymurai.info/"
Repository = "https://github.com/AymurAI/aymurai"
Issues = "https://github.com/AymurAI/aymurai/issues"

[dependency-groups]
loadtest = [
    "locust>=2.44.4",
    "lorem>=0.1.1",
]
tests = ["pytest>=9.0.2"]

[tool.setuptools.packages.find]
include = ["aymurai"]

[project.scripts]
aymurai-api = "aymurai.api.main:main"
pipeline-download = "aymurai.scripts.pipelines_download:pipelines_download"


[tool.setuptools.package-data]
"*" = ["*.yml", "*.yaml", "*.csv"]

[tool.setuptools_scm]
version_file = "aymurai/version.py"
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]


[tool.pylint.messages_control]
disable = "C0330, C0326"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--strict-markers", "--disable-warnings"]
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow (model loading, >30s)",
    "external: marks tests that depend on optional external binaries/services",
]
